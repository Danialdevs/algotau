<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>АлгоТау</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Информатикадан олимпиадаға дайындық, 5–11 сынып: сабақтар, тесттер және браузерде Python-да тексерілетін есептер.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rubik:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a rainbow mountain climb — each grade is a coloured step (5 coral … 11 violet); Barys the snow leopard guides the student. Deliberately one bright daytime theme for kids. */
:root {
  color-scheme: light;
  --bg: #EAF4FF;
  --surface: #FFFFFF;
  --surface-2: #F1F6FD;
  --ink: #1C1E3F;
  --muted: #565C84;
  --line: #D3E0F2;
  --blue: #2F5BEA;
  --blue-dark: #1E41B5;
  --sun: #FFC83D;
  --sun-dark: #D99A00;
  --coral: #F2554B;
  --green: #14A86C;
  --green-soft: #DDF7EA;
  --red: #E0413A;
  --red-soft: #FFE4E1;
  --orange: #E07A0C;
  --orange-soft: #FFF0D9;
  --pink: #FF8FA3;
  --gold: #E5A800;
  --silver: #8E9BB0;
  --bronze: #C7712E;
  --code-bg: #FBFCFF;
  --code-line: #DCE5F3;
  --syn-kw: #9B2FC9; --syn-str: #138A4A; --syn-num: #C25A00; --syn-com: #8A93AD; --syn-fn: #2459E0; --syn-bi: #0E8C9E;
  --f-display: "Rubik", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 18px;
  --c: var(--blue); --c-dark: var(--blue-dark); --c-soft: #E3EAFF;
}
.c5  { --c: #F2554B; --c-dark: #C23A31; --c-soft: #FFE6E3; }
.c6  { --c: #FF8A1F; --c-dark: #C96300; --c-soft: #FFEEDC; }
.c7  { --c: #F2B600; --c-dark: #B98600; --c-soft: #FFF5D1; }
.c8  { --c: #19B571; --c-dark: #0E8853; --c-soft: #DDF7EA; }
.c9  { --c: #12A9C2; --c-dark: #0A7D90; --c-soft: #DCF5FA; }
.c10 { --c: #2F5BEA; --c-dark: #1E41B5; --c-soft: #E3EAFF; }
.c11 { --c: #8A4DF0; --c-dark: #6630C4; --c-soft: #EFE6FF; }

* { box-sizing: border-box; }
html { scroll-padding-top: 84px; }
body {
  background: var(--bg); color: var(--ink); font: 600 16.5px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
  background-image: radial-gradient(circle at 1px 1px, rgba(47, 91, 234, .09) 1.5px, transparent 0);
  background-size: 26px 26px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--blue); text-decoration: none; font-weight: 700; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; line-height: 1.12; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 4.6vw, 3.3rem); }
h2 { font-size: clamp(1.45rem, 2.8vw, 2rem); }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
b, strong { font-weight: 800; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--surface-2); border: 1px solid var(--line); padding: .05em .35em; border-radius: 6px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font: 800 .76rem/1.2 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 3px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 66px; flex-wrap: wrap; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--ink); font: 800 1.3rem/1 var(--f-display); }
.brand:hover { text-decoration: none; }
.brand .tau { color: var(--blue); }
.brand svg { width: 42px; height: 42px; flex: none; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { color: var(--muted); font-weight: 800; padding: 8px 12px; border-radius: 12px; }
.nav a:hover { background: var(--surface-2); color: var(--ink); text-decoration: none; }
.nav a.on { color: var(--blue); background: #E3EAFF; }
.top .spacer { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 7px; font: 800 .84rem/1 var(--f-body); padding: 8px 12px; border-radius: 999px; background: var(--surface-2); border: 2px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.chip.pts { background: #FFF4CC; border-color: #FFE08A; color: #8A6200; }
.chip.pts svg { width: 18px; height: 18px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--silver); flex: none; }
.py-loading .dot { background: var(--orange); animation: pulse 1s infinite alternate; }
.py-ready .dot { background: var(--green); }
.py-fail .dot { background: var(--red); }
@keyframes pulse { to { opacity: .3; } }
.lang { display: inline-flex; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.lang button { border: 0; background: none; font: 800 .8rem/1 var(--f-body); color: var(--muted); padding: 8px 11px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--blue); color: #fff; }

/* chunky buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 800 .98rem/1 var(--f-body); padding: 13px 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; box-shadow: 0 4px 0 var(--line); transition: transform .08s, box-shadow .08s; }
.btn:hover { text-decoration: none; transform: translateY(-1px); box-shadow: 0 5px 0 var(--line); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 4px 0 var(--blue-dark); }
.btn.primary:hover { box-shadow: 0 5px 0 var(--blue-dark); }
.btn.primary:active { box-shadow: 0 1px 0 var(--blue-dark); }
.btn.go { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 4px 0 #0B7A4C; }
.btn.go:active { box-shadow: 0 1px 0 #0B7A4C; }
.btn.sun { background: var(--sun); border-color: var(--sun); color: #3A2A00; box-shadow: 0 4px 0 var(--sun-dark); }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { background: var(--surface-2); box-shadow: none; }
.btn.small { padding: 9px 13px; font-size: .88rem; border-radius: 12px; }
.btn:disabled { opacity: .6; cursor: progress; transform: none; }

main { padding-block: 28px 70px; display: block; }

/* mascot + bubble */
.mascot { flex: none; }
.bubble { position: relative; background: var(--surface); border: 3px solid var(--ink); border-radius: 20px; padding: 12px 16px; font-weight: 800; box-shadow: 4px 4px 0 var(--ink); }
.bubble::after { content: ""; position: absolute; left: -14px; top: 26px; border: 8px solid transparent; border-right: 10px solid var(--ink); }
.guide { display: flex; align-items: center; gap: 14px; }
@media (prefers-reduced-motion: no-preference) {
  .mascot.bob { animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-2deg); } }
}

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 36px; align-items: center; padding-block: 10px 36px; }
.hero h1 .hl { color: var(--blue); position: relative; white-space: nowrap; }
.hero h1 .hl2 { background: linear-gradient(transparent 62%, var(--sun) 62%, var(--sun) 92%, transparent 92%); }
.hero p.lead { font-size: 1.14rem; color: var(--muted); max-width: 54ch; margin-top: 16px; }
.hero .cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
.hero-side { display: grid; gap: 18px; min-width: 0; }
.protocol { background: var(--surface); border: 3px solid var(--ink); border-radius: var(--r); box-shadow: 6px 6px 0 var(--ink); padding: 16px 18px; min-width: 0; }
.protocol .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.protocol .head span:last-child { font: 600 .8rem/1.3 var(--f-mono); color: var(--muted); }
.protocol table { width: 100%; border-collapse: collapse; font: 600 .84rem/1.3 var(--f-mono); }
.protocol td { padding: 6px 4px; border-top: 2px dashed var(--line); }
.protocol td:last-child { text-align: right; color: var(--muted); }
.protocol .score { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.protocol .score b { font: 800 2rem/1 var(--f-display); color: var(--blue); }
.v { display: inline-block; min-width: 44px; text-align: center; font: 700 .76rem/1 var(--f-mono); padding: 6px 8px; border-radius: 9px; }
.v-OK { background: var(--green-soft); color: #0B7A4C; }
.v-WA, .v-RE, .v-CE { background: var(--red-soft); color: #B42A23; }
.v-TLE { background: var(--orange-soft); color: #A85600; }
.v-wait { background: var(--surface-2); color: var(--muted); }
.v-run { background: #FFF4CC; color: #8A6200; animation: pulse .6s infinite alternate; }

/* rainbow ascent */
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.section-head p { color: var(--muted); max-width: 58ch; }
.ascent-bands { display: grid; grid-template-columns: 4fr 3fr; gap: 14px; margin-bottom: 12px; }
.band { border-radius: 12px; padding: 8px 12px; font: 800 .82rem/1.3 var(--f-body); background: var(--surface); border: 2px dashed var(--line); color: var(--muted); }
.band.rep { border: 2px solid var(--blue); color: var(--blue); background: #E3EAFF; }
.steps { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 14px; align-items: end; }
.step { display: flex; flex-direction: column; background: var(--surface); border: 3px solid var(--c); border-radius: var(--r); overflow: hidden; color: var(--ink); box-shadow: 0 6px 0 var(--c-dark); transition: transform .15s ease; min-width: 0; }
.step:hover { text-decoration: none; transform: translateY(-5px) rotate(-1deg); }
.step .top-c { background: var(--c); color: #fff; padding: 12px 12px 10px; position: relative; min-height: calc(86px + var(--lift, 0px)); display: flex; align-items: end; overflow: hidden; }
.step .top-c svg { position: absolute; right: -6px; top: -4px; width: 54px; height: 54px; opacity: .35; }
.step .g { font: 800 3rem/0.9 var(--f-display); text-shadow: 0 3px 0 var(--c-dark); }
.step .g small { font-size: .82rem; font-weight: 700; margin-left: 3px; text-shadow: none; }
.step .body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.step .track { font: 800 1rem/1.2 var(--f-display); color: var(--c-dark); }
.step .stage { font-size: .8rem; color: var(--muted); line-height: 1.35; flex: 1; font-weight: 700; }
.step .meta { display: flex; justify-content: space-between; gap: 4px; font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 800; flex-wrap: wrap; }
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); border: 2px solid var(--line); overflow: hidden; display: block; }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 99px; }

.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 52px; }
.fact { padding: 20px; background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); display: grid; gap: 8px; align-content: start; }
.fact .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; }
.fact .ic svg { width: 26px; height: 26px; }
.fact p { color: var(--muted); font-size: .97rem; }

.resume { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: #FFF4CC; border: 2px solid #FFE08A; border-radius: var(--r); padding: 12px 16px; margin-bottom: 24px; }

/* olympiad page */
.prose { max-width: 800px; }
.prose > * + * { margin-top: 14px; }
.prose h2 { margin-top: 42px; }
.prose ul { margin: 0; padding-left: 1.2em; }
.prose li + li { margin-top: 8px; }
.timeline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
.timeline > div { padding: 16px; border-radius: var(--r); background: var(--surface); border: 3px solid var(--c); box-shadow: 0 5px 0 var(--c-dark); min-width: 0; }
.timeline b { display: block; font: 800 1.05rem/1.25 var(--f-display); margin: 6px 0 4px; color: var(--c-dark); }
.timeline span { font-size: .9rem; color: var(--muted); }
.tbl-wrap { overflow-x: auto; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); }
table.t { width: 100%; border-collapse: collapse; font-size: .95rem; }
table.t th, table.t td { text-align: left; padding: 10px 14px; border-top: 2px solid var(--line); vertical-align: top; }
table.t th { border-top: 0; font: 800 .76rem/1.3 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
table.t td:first-child { white-space: nowrap; font-weight: 800; }

/* grade page */
.crumbs { display: flex; gap: 8px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); margin-bottom: 16px; font-weight: 700; }
.crumbs a { color: var(--muted); }
.crumbs span::before { content: "›"; margin-right: 8px; opacity: .6; }
.grade-hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 26px; align-items: center; background: var(--c); color: #fff; border-radius: 26px; padding: 26px 30px; margin-bottom: 30px; box-shadow: 0 8px 0 var(--c-dark); position: relative; overflow: hidden; }
.grade-hero .grade-num { font: 800 clamp(4.5rem, 11vw, 7.5rem)/0.82 var(--f-display); text-shadow: 0 5px 0 var(--c-dark); }
.grade-hero .eyebrow { color: rgba(255, 255, 255, .85); }
.grade-hero h1 { font-size: clamp(1.6rem, 3.4vw, 2.4rem); margin-top: 6px; }
.grade-hero p { max-width: 62ch; margin-top: 8px; }
.grade-hero .goal { background: rgba(255, 255, 255, .18); border-radius: 12px; padding: 8px 12px; margin-top: 12px; font-size: .93rem; }
.grade-hero .bar { background: rgba(255, 255, 255, .3); border-color: transparent; }
.grade-hero .bar i { background: #fff; }
.grade-hero .mascot { width: 130px; height: 130px; }
.topics { display: grid; gap: 14px; }
.topic-row { display: grid; grid-template-columns: 60px minmax(0, 1fr) auto; gap: 18px; align-items: center; background: var(--surface); border: 3px solid var(--line); border-radius: var(--r); padding: 16px 18px; color: var(--ink); transition: border-color .15s, transform .15s; }
.topic-row:hover { text-decoration: none; border-color: var(--c); transform: translateX(4px); }
.topic-row .n { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--c-soft); color: var(--c-dark); font: 800 1.4rem/1 var(--f-display); }
.topic-row.done .n { background: var(--c); color: #fff; }
.topic-row h3 { margin-bottom: 3px; }
.topic-row p { color: var(--muted); font-size: .93rem; }
.topic-row .side { display: flex; flex-direction: column; align-items: end; gap: 8px; min-width: 130px; }
.medals { display: flex; gap: 6px; }
.medal { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--m, var(--silver)); background: var(--surface); display: inline-grid; place-items: center; font: 800 .62rem/1 var(--f-body); color: var(--m); flex: none; }
.medal.l1 { --m: var(--bronze); } .medal.l2 { --m: var(--silver); } .medal.l3 { --m: var(--gold); }
.medal.done { background: var(--m); color: #fff; }
.medal.part { background: linear-gradient(to top, var(--m) 50%, var(--surface) 50%); }

/* topic page */
.topic-layout { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 36px; align-items: start; }
.article { max-width: 780px; min-width: 0; }
.article > * + * { margin-top: 16px; }
.lesson { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 26px 28px; display: grid; gap: 16px; }
.lesson h2.lesson-h { font-size: 1.3rem; margin-top: 14px; color: var(--c-dark); display: flex; gap: 10px; align-items: center; }
.lesson h2.lesson-h::before { content: ""; width: 12px; height: 12px; border-radius: 4px; background: var(--c); transform: rotate(45deg); flex: none; }
.lesson h2.lesson-h:first-child { margin-top: 0; }
.lesson p { font-size: 1.04rem; font-weight: 600; }
.lesson ul { margin: 0; padding-left: 1.2em; }
.lesson li + li { margin-top: 6px; }
.sec-h { font-size: 1.5rem; margin-top: 36px !important; display: flex; gap: 10px; align-items: center; }
.callout { border-radius: 16px; padding: 14px 16px 14px 56px; position: relative; font-size: 1rem; }
.callout::before { position: absolute; left: 14px; top: 13px; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font: 800 .95rem/1 var(--f-body); }
.callout.tip { background: #E3EAFF; }
.callout.tip::before { content: "★"; background: var(--blue); color: #fff; }
.callout.warn { background: #FFF0D9; }
.callout.warn::before { content: "!"; background: var(--orange); color: #fff; }
.callout .lbl { display: block; font: 800 .74rem/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; color: var(--muted); }
.codeblock { border: 2px solid var(--code-line); background: var(--code-bg); border-radius: 16px; overflow: hidden; }
.codeblock pre { margin: 0; padding: 14px 16px; overflow-x: auto; font: 400 .9rem/1.6 var(--f-mono); color: var(--ink); tab-size: 4; }
.codeblock .bar2 { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 8px 8px 14px; border-top: 2px solid var(--code-line); flex-wrap: wrap; background: var(--surface-2); }
.codeblock .bar2 .eyebrow { font-size: .68rem; }
.codeblock .out { margin: 0; padding: 10px 16px; border-top: 2px dashed var(--code-line); font: 400 .88rem/1.5 var(--f-mono); white-space: pre-wrap; color: #0B7A4C; background: #F3FCF7; }
.codeblock .out.err { color: #B42A23; background: #FFF5F4; }
.side-nav { position: sticky; top: 92px; display: grid; gap: 14px; }
.side-card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 16px; }
.side-card a { display: block; color: var(--muted); padding: 5px 0; font-size: .95rem; }
.side-card a:hover { color: var(--ink); }
.big-pct { font: 800 2.2rem/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--c-dark); margin: 4px 0 10px; }

.quiz { display: grid; gap: 14px; }
.q { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 18px; }
.q p.qt { font-weight: 800; margin-bottom: 12px; font-size: 1.04rem; }
.q .opts { display: grid; gap: 8px; }
.q button.opt { text-align: left; font: 700 1rem/1.4 var(--f-body); color: var(--ink); background: var(--surface-2); border: 2px solid var(--line); padding: 11px 14px; border-radius: 12px; cursor: pointer; }
.q button.opt:hover { border-color: var(--c); }
.q button.opt.right { border-color: var(--green); background: var(--green-soft); }
.q button.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.q .why { margin-top: 12px; font-size: .95rem; color: var(--muted); display: flex; gap: 10px; align-items: start; }
.q .why .mascot { width: 44px; height: 44px; }

.plist { display: grid; gap: 12px; }
.prow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 3px solid var(--line); border-radius: var(--r); padding: 14px 16px; color: var(--ink); transition: border-color .15s, transform .15s; }
.prow:hover { text-decoration: none; border-color: var(--c); transform: translateX(4px); }
.prow .medal { width: 36px; height: 36px; font-size: .85rem; }
.prow small { color: var(--muted); font-weight: 700; }
.score-pill { font: 700 .82rem/1 var(--f-mono); padding: 7px 10px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
.score-pill.full { background: var(--green-soft); color: #0B7A4C; }
.score-pill.partial { background: var(--orange-soft); color: #A85600; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; flex-wrap: wrap; }

/* problem page */
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 22px; align-items: start; }
.statement { background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 24px; min-width: 0; }
.statement > * + * { margin-top: 14px; }
.p-title { display: flex; gap: 14px; align-items: center; }
.p-title .medal { width: 46px; height: 46px; font-size: 1rem; border-width: 4px; }
.limits { display: flex; flex-wrap: wrap; gap: 6px; }
.limits span { font: 600 .76rem/1.2 var(--f-mono); color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); padding: 5px 8px; border-radius: 8px; }
.statement h4 { margin: 22px 0 0; font: 800 .8rem/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--c-dark); }
.examples { display: grid; gap: 10px; }
.ex { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); border: 2px solid var(--code-line); border-radius: 12px; overflow: hidden; }
.ex > div { min-width: 0; }
.ex > div + div { border-left: 2px solid var(--code-line); }
.ex .lbl { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 6px 10px; font: 800 .72rem/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.ex pre { margin: 0; padding: 8px 10px; font: 400 .88rem/1.45 var(--f-mono); background: var(--code-bg); overflow-x: auto; min-height: 2.6em; }
.linkbtn { border: 0; background: none; color: var(--blue); font: 800 .74rem/1 var(--f-body); cursor: pointer; padding: 2px; letter-spacing: 0; text-transform: none; }
details.reveal { border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; background: var(--surface-2); }
details.reveal summary { cursor: pointer; font-weight: 800; padding: 12px 0; }
details.reveal[open] { background: var(--surface); }
details.reveal[open] summary { border-bottom: 2px solid var(--line); margin-bottom: 12px; }
details.reveal > div { padding-bottom: 14px; }
.lock { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .94rem; color: var(--muted); padding: 12px 16px; border: 2px dashed var(--line); border-radius: 14px; }

.ide { display: grid; gap: 14px; min-width: 0; position: sticky; top: 84px; }
.ide-card { background: var(--surface); border: 3px solid var(--ink); border-radius: 22px; overflow: hidden; min-width: 0; box-shadow: 6px 6px 0 var(--ink); }
.ide-bar { display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 2px solid var(--line); flex-wrap: wrap; background: var(--surface-2); }
.ide-bar .spacer { flex: 1; }
.langtag { font: 700 .78rem/1 var(--f-mono); color: #fff; padding: 7px 10px; border-radius: 9px; background: var(--ink); }
kbd { font: 600 .74rem/1 var(--f-mono); padding: 2px 6px; border-radius: 6px; border: 2px solid var(--line); background: var(--surface); color: var(--muted); }

.ed { display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--code-bg); height: var(--ed-h, 340px); position: relative; }
.ed-gutter { overflow: hidden; padding: 12px 8px 12px 12px; font: 400 .9rem/1.6 var(--f-mono); color: var(--syn-com); text-align: right; user-select: none; border-right: 2px solid var(--code-line); min-width: 44px; }
.ed-gutter div.err { color: #fff; background: var(--red); border-radius: 4px; padding-right: 3px; }
.ed-body { position: relative; min-width: 0; overflow: hidden; }
.ed-body pre, .ed-body textarea { position: absolute; inset: 0; margin: 0; padding: 12px 14px; font: 400 .9rem/1.6 var(--f-mono); tab-size: 4; white-space: pre; overflow-wrap: normal; letter-spacing: 0; border: 0; }
.ed-body pre { pointer-events: none; color: var(--ink); overflow: hidden; }
.ed-body pre code { font: inherit; background: none; padding: 0; border: 0; border-radius: 0; }
.ed-body textarea { resize: none; background: transparent; color: transparent; caret-color: var(--ink); overflow: auto; outline: none; }
.ed-body textarea::selection { background: rgba(47, 91, 234, .25); color: transparent; }
.tk-kw { color: var(--syn-kw); font-weight: 600; } .tk-str { color: var(--syn-str); } .tk-num { color: var(--syn-num); }
.tk-com { color: var(--syn-com); font-style: italic; } .tk-fn { color: var(--syn-fn); } .tk-bi { color: var(--syn-bi); }
.ed-resize { height: 10px; cursor: ns-resize; background: var(--surface-2); border-top: 2px solid var(--line); }

.io { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.io > div { min-width: 0; display: flex; flex-direction: column; }
.io > div + div { border-left: 2px solid var(--line); }
.io .lbl { padding: 8px 12px; font: 800 .72rem/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.io textarea, .io pre { margin: 0; flex: 1; min-height: 120px; max-height: 260px; padding: 10px 12px; font: 400 .88rem/1.5 var(--f-mono); background: var(--code-bg); color: var(--ink); border: 0; resize: vertical; overflow: auto; white-space: pre-wrap; outline: none; }
.io pre.err { color: #B42A23; }
.err-help { padding: 12px; font-size: .92rem; border-top: 2px solid var(--line); background: var(--red-soft); display: flex; gap: 10px; align-items: center; }
.err-help .mascot { width: 44px; height: 44px; }

.verdict { padding: 16px; display: grid; gap: 12px; }
.verdict .tests { display: flex; flex-wrap: wrap; gap: 6px; }
.verdict .tests button { border: 0; cursor: pointer; }
.verdict .summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.verdict .summary b { font: 800 1.7rem/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--blue); }
.verdict .detail { border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
.verdict .detail .row { display: grid; grid-template-columns: 120px minmax(0, 1fr); border-top: 2px solid var(--line); }
.verdict .detail .row:first-child { border-top: 0; }
.verdict .detail .row > span { padding: 8px 10px; font: 800 .72rem/1.3 var(--f-body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.verdict .detail pre { margin: 0; padding: 8px 10px; font: 400 .86rem/1.45 var(--f-mono); white-space: pre-wrap; max-height: 160px; overflow: auto; }
.win { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; background: var(--green-soft); border: 2px solid #9BE3C1; color: #0B7A4C; font-weight: 800; }
.win .mascot { width: 64px; height: 64px; }
.win big { display: block; font: 800 1.3rem/1.1 var(--f-display); color: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .win { animation: pop .4s cubic-bezier(.3, 1.6, .5, 1); } }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; width: 100%; height: 100%; }

.empty { padding: 40px; text-align: center; color: var(--muted); border: 3px dashed var(--line); border-radius: var(--r); background: var(--surface); display: grid; justify-items: center; gap: 12px; }
footer { border-top: 3px solid var(--line); padding-block: 22px; color: var(--muted); font-size: .88rem; background: var(--surface); }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
footer .foot-author { flex-basis: 100%; color: var(--ink); font-weight: 700; }
footer .foot-author a { color: var(--blue-dark); }
.author { margin-top: 28px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 20px 22px; background: var(--surface); border: 3px solid var(--ink); border-radius: var(--r); box-shadow: 6px 6px 0 var(--sun); }
.author .ava { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex: none; background: linear-gradient(135deg, #F2554B, #FF8A1F 45%, #8A4DF0); color: #fff; font-family: var(--f-head); font-weight: 900; font-size: 1.5rem; border: 3px solid var(--ink); }
.author .who { flex: 1 1 240px; min-width: 0; display: grid; gap: 2px; }
.author .who b { font-family: var(--f-head); font-size: 1.2rem; }
.author .who span { color: var(--muted); }
.insta { display: inline-flex; align-items: center; gap: 8px; }
.insta svg { width: 20px; height: 20px; flex: none; }

@media (max-width: 1080px) {
  .steps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .step .top-c { min-height: 86px; }
  .ascent-bands { display: none; }
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .ide { position: static; }
  .topic-layout { grid-template-columns: minmax(0, 1fr); }
  .side-nav { position: static; order: -1; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
  .grade-hero { grid-template-columns: auto minmax(0, 1fr); }
  .grade-hero .mascot { display: none; }
}
@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts { grid-template-columns: minmax(0, 1fr); margin-top: 32px; }
  .timeline { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .topic-row { grid-template-columns: 44px minmax(0, 1fr); gap: 12px; }
  .topic-row .n { width: 42px; height: 42px; font-size: 1.1rem; border-radius: 12px; }
  .topic-row .side { grid-column: 2; align-items: start; min-width: 0; }
  .grade-hero { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 20px; }
  .io { grid-template-columns: minmax(0, 1fr); }
  .io > div + div { border-left: 0; border-top: 2px solid var(--line); }
  .ex { grid-template-columns: minmax(0, 1fr); }
  .ex > div + div { border-left: 0; border-top: 2px solid var(--code-line); }
  .statement, .lesson { padding: 16px; border-radius: 18px; }
  .nav a { padding: 7px 9px; }
  .verdict .detail .row { grid-template-columns: minmax(0, 1fr); }
  .top { position: static; }
  .top .wrap { gap: 8px 10px; }
  .top .spacer { display: none; }
  #pytext { display: none; }
  html { scroll-padding-top: 12px; }
  .ide-card, .protocol { box-shadow: 4px 4px 0 var(--ink); }
  .hero-side .guide .mascot { width: 84px; height: 84px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
